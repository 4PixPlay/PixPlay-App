versions:
  - version: "0.14.4"
    releaseDate: "2026-09-05"
    changes:
      - "بازگردانی فایل های اصلی بازی با غیرفعال کردن زیرنویس یا فونت"
  - version: "0.14.3"
    releaseDate: "2026-09-05"
    changes:
      - "پشتیبانی از فونت جدید: یکان بخ"
  - version: "0.14.2"
    releaseDate: "2026-07-24"
    changes:
      - "پشتیبانی از نصب فونت های هم نام"
  - version: "0.14.0"
    releaseDate: "2026-07-12"
    changes:
      - "افزودن پشتیبانی از موتور Glacier استودیوی IO Interactive (شامل عناوینی نظیر Hitman ،Project 007 و غیره)"
      - "افزودن قابلیت نصب چندین فایل مجزا برای یک فونت واحد"
      - "رفع مشکل اجرای بازی‌هایی که نیازمند دسترسی Administrator هستند"
      - "بهبود سیستم مدیریت خطاها جهت پایداری بیشتر برنامه"
      - "رفع خطای احتمالی که ممکن بود هنگام دانلود محتوای ترجمه رخ دهد"
  - version: "0.13.0"
    releaseDate: "2026-05-20"
    changes:
      - "افزودن پشتیبانی از موتور RE-Engine  کپکام (شامل عناوینی نظیر Resident Evil، Devil May Cry، Pragmata و غیره)"
      - "مخفی‌سازی خودکار تب فونت برای بازی‌هایی که فاقد پشتیبانی از قابلیت تغییر فونت هستند"
      - "بهبود و افزایش دقت در سیستم شناسایی بازی‌ها و تحلیل ساختار آن‌ها"
      - "انتقال کامل سیستم بروزرسانی و دریافت تاریخچه تغییرات برنامه از گیت‌هاب به سرورهای داخل ایران پیکس پلی"
      - "بهبود عملکرد حافظه پنهان (کش) تصاویر کاور بازی‌ها"
      - "بهینه‌سازی ساختار داخلی و کدهای برنامه جهت افزایش سرعت اجرای نرم‌افزار و بهبود پایداری کلی"
  - version: "0.12.3"
    releaseDate: "2026-02-27"
    changes:
      - "افزودن نمایش دائمی وضعیت بروزرسانی روی کارت بازی ها به همراه نمایش تعداد بازی های دارای بروزرسانی"
      - "بهبود فرآیند بروزرسانی زیرنویس برای پشتیبانی بهتر از فایل های چندگانه و فایل های تغییر نام یافته"
      - "رفع مشکل تشخیص وضعیت نصب در محتوای چند فایلی (اعتبارسنجی کامل همه فایل های نصب شده)"
      - "بهبود تطبیق آیتم های نصب شده با استفاده از شناسه پایدار جهت جلوگیری از خطاهای تطبیق در بروزرسانی"
      - "رفع مشکل بروزرسانی فونت: اکنون فقط فونت انتخاب شده قبلی حفظ و بروزرسانی می‌شود و همه فونت ها همزمان نصب نمی شوند"
  - version: "0.12.2"
    releaseDate: "2026-02-26"
    changes:
      - "رفع خطای نمایش اشتباه «محدودیت نصب روی ۲ سیستم»"
  - version: "0.12.1"
    releaseDate: "2026-02-25"
    changes:
      - "افزودن قابلیت جستجو در بخش بازی‌های نصب‌شده و خریداری‌شده"
      - "رفع مشکل عملکرد دکمه «تلاش مجدد» هنگام آپدیت برنامه و بهبود نمایش خطاهای دانلود"
      - "افزودن اعلان (نوتیفیکیشن) جهت اطلاع‌رسانی در صورت بروز خطا در دریافت تصویر کاور بازی‌ها"
      - "بهبود پیام‌های خطای نصب زیرنویس (نمایش پیام دقیق‌تر هنگام بروز مشکلات ارتباطی مانند روشن بودن VPN یا DNS)"
      - "رفع مشکل عدم حذف فونت‌های غیرفعال پیشین، هنگام جایگزینی با فونت جدید"
      - "رفع باگ نمایش اشتباه دکمه‌ها در تب فونت‌ها (مانند نمایش دکمه غیرفعال‌سازی برای فونت‌های نصب‌نشده)"
      - "نمایش همیشگی نکات و پیام‌های مهم هر زیرنویس پیش از اقدام به نصب"
  - version: "0.12.0"
    releaseDate: "2026-02-24"
    changes:
      - "افزودن امکان غیرفعال سازی فونت‌ها بدون نیاز به حذف آن‌ها"
      - "نمایش پیام راهنما پس از نصب زیرنویس جهت ارائه نکات مهم (مانند تغییر زبان بازی) در قالب یادداشت، اطلاعیه یا هشدار"
      - "رفع مشکل پاکسازی حافظه پنهان (کش) تصاویر"
      - "برطرف سازی مشکل انتخاب فایل اجرایی جهت ایجاد میانبر (Shortcut)"
  - version: "0.11.0"
    releaseDate: "2026-02-12"
    changes:
      - "بهبود وضوح و خوانایی نام بازی روی کارت‌ها"
      - "اصلاح نمایش نوار پیشرفت هنگام آپدیت زیرنویس"
      - "اصلاح رنگ‌بندی متون جهت هماهنگی بیشتر رابط کاربری"
      - "بهینه‌سازی سیستم ورود و تعدیل محدودیت‌های امنیتی لاگین"
      - "رفع مشکل استخراج و نصب محتویات فایل‌های زیرنویس"
      - "برطرف‌سازی خطای تشخیص اشتباه محدودیت نصب"
      - "اولویت‌دهی به فونت «وزیر» در ابتدای لیست انتخاب فونت"
      - "انتقال خودکار به تب فونت‌ها بلافاصله پس از نصب زیرنویس"
      - "اصلاح نمایش متون و استفاده از اعداد فارسی در سراسر برنامه"
      - "بهبود کنتراست و نمایش آیکون‌های دانلود و نصب روی کارت‌ها"
  - version: "0.10.0"
    releaseDate: "2025-12-02"
    changes:
      - "انتشار نسخه اولیه با تمامی امکانات"